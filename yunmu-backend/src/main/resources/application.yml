server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: yunmu-backend
  profiles:
    active: dev

  # SQL Server 数据库配置
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=yunmu_db;encrypt=false;trustServerCertificate=true
    username: sa
    password: 1234567890
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # JPA 配置
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# 自定义配置
yunmu:
  python-service:
    url: http://localhost:5000
    timeout: 30000
  websocket:
    enabled: true
    path: /ws
  data:
    retention-days: 90
    batch-size: 100
  algorithm:
    rumination-threshold: 0.7
    feeding-threshold: 0.65
    health-alert-threshold: 0.8
  monitor:
    enable: true
    port: 8081
  file:
    upload-path: ./uploads/
    max-size: 10485760

# Actuator监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

# 日志配置
logging:
  level:
    com.yunmu: INFO
    org.springframework.web: INFO
    org.hibernate: WARN

---
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=yunmu_db;encrypt=false;trustServerCertificate=true
    username: sa
    password: 1234567890
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

yunmu:
  python-service:
    url: http://localhost:5000

# MQTT配置
mqtt:
  broker:
    url: tcp://120.27.235.176:1883
  client:
    id: yunmu-server-${random.int(1000,9999)}
  topics:
    - 7249
    - 7249/#
    - device/+/gps
    - device/+/sensor
    - device/+/heartbeat
  username: root
  password: root
  qos: 1
  completion-timeout: 5000

# Python服务配置
python:
  service:
    url: http://localhost:5000
    timeout: 30000